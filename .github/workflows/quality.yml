name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: build, fmt, clippy, test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # The repo's binding quality gates (docs/code_guide.md §1): every one
      # must pass before a commit lands. Travis keeps broader release
      # coverage (stable/beta/nightly); this job enforces the merge bar.
      - name: Build
        run: cargo build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint (clippy, all targets, warnings denied)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
