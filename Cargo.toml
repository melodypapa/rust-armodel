[package]
name = "armodel"
version = "0.1.1"
description = "Rust library to parse and generate of AUTOSAR ARXML."
authors = ["melodypapa <melodypapa@github.com>"]
repository = "https://github.com/melodypapa/rust_armodel"
readme = "README.md"
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4", features = ["derive"] }
quick-xml = "0.42.0"
slotmap = "1.0"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "roundtrip"
path = "tests/integration/roundtrip.rs"

[[test]]
name = "all_fixtures"
path = "tests/integration/all_fixtures.rs"

[[test]]
name = "arxml_format"
path = "tests/integration/arxml_format.rs"

[[test]]
name = "format_byte_roundtrip"
path = "tests/integration/format_byte_roundtrip.rs"
